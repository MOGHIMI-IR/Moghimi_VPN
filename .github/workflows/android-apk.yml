name: Build Moghimi VPN Android

on:
  push:
    branches: [main]
    paths:
      - "android/src/**"
      - "android/patch-upstream.sh"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: moghimi-vpn-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Moghimi VPN
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "14742923"
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"
          log-accepted-android-sdk-licenses: false

      - name: Install Android NDK
        shell: bash
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Fetch pinned Android engine
        shell: bash
        run: |
          git clone https://github.com/2dust/v2rayNG.git android/upstream
          git -C android/upstream checkout cc074f0b13099eee33988b46b1b74c804e9a3a2a
          git -C android/upstream submodule update --init --recursive

      - name: Validate and apply Moghimi VPN patch
        shell: bash
        run: |
          bash -n android/patch-upstream.sh
          bash android/patch-upstream.sh

      - name: Build native tunnel helper
        working-directory: android/upstream
        shell: bash
        run: |
          bash compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs V2rayNG/app/

      - name: Resolve pinned native library release
        id: xray
        working-directory: android/upstream
        shell: bash
        run: |
          git -C AndroidLibXrayLite fetch --tags --force
          TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using AndroidLibXrayLite tag: $TAG"

      - name: Download native library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: "2dust/AndroidLibXrayLite"
          tag: ${{ steps.xray.outputs.tag }}
          fileName: "libv2ray.aar"
          out-file-path: "android/upstream/V2rayNG/app/libs"

      - name: Run tests, lint and build APKs
        working-directory: android/upstream/V2rayNG
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew testPlaystoreDebugUnitTest lintPlaystoreDebug assemblePlaystoreDebug --stacktrace

      - name: Verify package and APK signatures
        shell: bash
        run: |
          mkdir -p release-files
          cp android/upstream/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk release-files/
          : > release-files/SIGNING.txt
          for apk in release-files/*.apk; do
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$apk" >> release-files/SIGNING.txt
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" | grep -F "package: name='ir.moghimi.vpn'"
          done
          (cd release-files && sha256sum *.apk > SHA256SUMS)

      - name: Upload APKs, checksums and signing details
        uses: actions/upload-artifact@v4
        with:
          name: Moghimi-VPN-Android-Beta
          path: release-files/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish public beta release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: moghimi-vpn-beta-${{ github.run_number }}
          name: Moghimi VPN Beta ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: release-files/*
          fail_on_unmatched_files: true

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Moghimi VPN — Android"
            echo ""
            echo "- Application ID: ir.moghimi.vpn"
            echo "- User interface: Moghimi VPN smart dashboard"
            echo "- Android engine: pinned upstream revision cc074f0b13099eee33988b46b1b74c804e9a3a2a"
            echo "- Build type: beta / debug-signed until a private stable keystore is configured"
            echo "- Test, lint and APK assembly results are listed above."
          } >> "$GITHUB_STEP_SUMMARY"
